<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Avocado — an original drawing for the store screenshots (store-screenshot-studio).
       The paper edge is the filter below, so the art itself stays plain shapes. -->
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="2.6" result="soft"/>
      <feComponentTransfer in="soft" result="edge"><feFuncA type="linear" slope="12" intercept="-5.5"/></feComponentTransfer>
      <feFlood flood-color="#FFF8F1" result="paper"/>
      <feComposite in="paper" in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#cut)">
    <g transform="rotate(16 120 120) translate(120 125) scale(.9) translate(-120 -125)">
      <path d="M120 30C148 30 158 58 164 84C172 120 196 136 196 168C196 202 162 220 120 220C78 220 44 202 44 168C44 136 68 120 76 84C82 58 92 30 120 30Z" fill="#2F7D3B"/>
      <path d="M120 30C148 30 158 58 164 84C172 120 196 136 196 168C196 202 162 220 120 220C78 220 44 202 44 168C44 136 68 120 76 84C82 58 92 30 120 30Z" fill="#DCE88F" transform="translate(120 132) scale(.86) translate(-120 -132)"/>
      <path d="M120 30C148 30 158 58 164 84C172 120 196 136 196 168C196 202 162 220 120 220C78 220 44 202 44 168C44 136 68 120 76 84C82 58 92 30 120 30Z" fill="#EDF4B4" transform="translate(120 136) scale(.66) translate(-120 -136)"/>
      <circle cx="120" cy="164" r="31" fill="#8B5A2B"/>
      <circle cx="110" cy="154" r="10" fill="#B58150"/>
    </g>
  </g>
</svg>
