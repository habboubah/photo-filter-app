<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Broccoli — an original drawing for the store screenshots (store-screenshot-studio).
       The paper edge is the filter below, so the art itself stays plain shapes. -->
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="2.6" result="soft"/>
      <feComponentTransfer in="soft" result="edge"><feFuncA type="linear" slope="12" intercept="-5.5"/></feComponentTransfer>
      <feFlood flood-color="#FFF8F1" result="paper"/>
      <feComposite in="paper" in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="b"><path d="M100 140H140L148 204Q148 218 120 218Q92 218 92 204Z"/></clipPath>
  </defs>
  <g filter="url(#cut)">
    <path d="M100 140H140L148 204Q148 218 120 218Q92 218 92 204Z" fill="#9CCB6E"/>
    <rect x="122" y="130" width="40" height="100" fill="#84B957" clip-path="url(#b)"/>
    <g fill="#3E9B4F">
      <circle cx="78" cy="116" r="38"/><circle cx="162" cy="116" r="38"/><circle cx="120" cy="86" r="46"/>
      <circle cx="102" cy="134" r="30"/><circle cx="140" cy="134" r="30"/>
    </g>
    <g fill="#5BB86A">
      <circle cx="104" cy="70" r="15"/><circle cx="138" cy="82" r="12"/><circle cx="70" cy="104" r="13"/><circle cx="164" cy="100" r="12"/><circle cx="118" cy="112" r="10"/>
    </g>
  </g>
</svg>
