<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Carrot — an original drawing for the store screenshots (store-screenshot-studio).
       The paper edge is the filter below, so the art itself stays plain shapes. -->
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="2.6" result="soft"/>
      <feComponentTransfer in="soft" result="edge"><feFuncA type="linear" slope="12" intercept="-5.5"/></feComponentTransfer>
      <feFlood flood-color="#FFF8F1" result="paper"/>
      <feComposite in="paper" in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="b"><path d="M120 66C148 66 162 84 158 108L138 204C134 220 106 220 102 204L82 108C78 84 92 66 120 66Z"/></clipPath>
  </defs>
  <g filter="url(#cut)">
    <g transform="rotate(38 120 120)">
      <ellipse cx="98" cy="46" rx="12" ry="28" fill="#2E8B3D" transform="rotate(-26 98 46)"/>
      <ellipse cx="142" cy="46" rx="12" ry="28" fill="#2E8B3D" transform="rotate(26 142 46)"/>
      <ellipse cx="120" cy="38" rx="13" ry="32" fill="#43A047"/>
      <path d="M120 66C148 66 162 84 158 108L138 204C134 220 106 220 102 204L82 108C78 84 92 66 120 66Z" fill="#F6892B"/>
      <rect x="124" y="60" width="50" height="170" fill="#E06E14" clip-path="url(#b)"/>
      <g fill="#C95C0C">
        <rect x="86" y="102" width="30" height="7" rx="3.5"/>
        <rect x="122" y="130" width="28" height="7" rx="3.5"/>
        <rect x="96" y="160" width="24" height="7" rx="3.5"/>
      </g>
    </g>
  </g>
</svg>
