<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Cherries — an original drawing for the store screenshots (store-screenshot-studio).
       The paper edge is the filter below, so the art itself stays plain shapes. -->
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="2.6" result="soft"/>
      <feComponentTransfer in="soft" result="edge"><feFuncA type="linear" slope="12" intercept="-5.5"/></feComponentTransfer>
      <feFlood flood-color="#FFF8F1" result="paper"/>
      <feComposite in="paper" in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="b"><circle cx="82" cy="164" r="44"/></clipPath>
    <clipPath id="c"><circle cx="164" cy="150" r="42"/></clipPath>
  </defs>
  <g filter="url(#cut)">
    <path d="M82 124C86 86 108 56 142 36M164 110C162 80 152 56 142 36" fill="none" stroke="#2A7A3B" stroke-width="8" stroke-linecap="round"/>
    <path d="M142 38C160 16 190 16 206 32C190 54 162 56 142 38Z" fill="#43A047"/>
    <circle cx="82" cy="164" r="44" fill="#B81D34"/>
    <circle cx="76" cy="156" r="44" fill="#DA2F47" clip-path="url(#b)"/>
    <circle cx="164" cy="150" r="42" fill="#B81D34"/>
    <circle cx="158" cy="142" r="42" fill="#DA2F47" clip-path="url(#c)"/>
    <ellipse cx="60" cy="146" rx="7" ry="13" fill="#FF8496" transform="rotate(30 60 146)"/>
    <ellipse cx="144" cy="132" rx="7" ry="13" fill="#FF8496" transform="rotate(30 144 132)"/>
  </g>
</svg>
