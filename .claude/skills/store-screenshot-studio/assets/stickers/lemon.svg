<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Lemon — an original drawing for the store screenshots (store-screenshot-studio).
       The paper edge is the filter below, so the art itself stays plain shapes. -->
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="2.6" result="soft"/>
      <feComponentTransfer in="soft" result="edge"><feFuncA type="linear" slope="12" intercept="-5.5"/></feComponentTransfer>
      <feFlood flood-color="#FFF8F1" result="paper"/>
      <feComposite in="paper" in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="b"><ellipse cx="120" cy="122" rx="76" ry="58"/></clipPath>
  </defs>
  <g filter="url(#cut)">
    <g transform="rotate(-22 120 120)">
      <ellipse cx="46" cy="122" rx="17" ry="13" fill="#F5B301"/>
      <ellipse cx="194" cy="122" rx="17" ry="13" fill="#FFD43B"/>
      <ellipse cx="120" cy="122" rx="76" ry="58" fill="#F5B301"/>
      <ellipse cx="114" cy="112" rx="76" ry="58" fill="#FFD43B" clip-path="url(#b)"/>
      <ellipse cx="86" cy="94" rx="20" ry="8" fill="#FFF0A6" transform="rotate(-24 86 94)"/>
      <circle cx="132" cy="132" r="3" fill="#F5B301"/><circle cx="152" cy="112" r="3" fill="#F5B301"/><circle cx="108" cy="146" r="3" fill="#F5B301"/>
      <path d="M186 104C196 76 220 66 238 74C232 98 212 112 186 104Z" fill="#3E9B4F" transform="translate(-14 2)"/>
      <path d="M176 104C190 92 204 84 220 78" fill="none" stroke="#2A7A3B" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
