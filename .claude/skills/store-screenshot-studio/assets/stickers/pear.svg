<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Pear — an original drawing for the store screenshots (store-screenshot-studio).
       The paper edge is the filter below, so the art itself stays plain shapes. -->
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="2.6" result="soft"/>
      <feComponentTransfer in="soft" result="edge"><feFuncA type="linear" slope="12" intercept="-5.5"/></feComponentTransfer>
      <feFlood flood-color="#FFF8F1" result="paper"/>
      <feComposite in="paper" in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="b"><path d="M120 30C148 30 158 58 164 84C172 120 196 136 196 168C196 202 162 220 120 220C78 220 44 202 44 168C44 136 68 120 76 84C82 58 92 30 120 30Z"/></clipPath>
  </defs>
  <g filter="url(#cut)">
    <g transform="rotate(-10 120 120) translate(120 130) scale(.86) translate(-120 -130)">
      <rect x="114" y="6" width="12" height="38" rx="6" fill="#7A4B22" transform="rotate(12 120 30)"/>
      <path d="M128 26C146 4 174 2 190 16C176 38 150 44 128 26Z" fill="#3E9B4F"/>
      <path d="M120 30C148 30 158 58 164 84C172 120 196 136 196 168C196 202 162 220 120 220C78 220 44 202 44 168C44 136 68 120 76 84C82 58 92 30 120 30Z" fill="#B4CB3C"/>
      <path d="M120 30C148 30 158 58 164 84C172 120 196 136 196 168C196 202 162 220 120 220C78 220 44 202 44 168C44 136 68 120 76 84C82 58 92 30 120 30Z" fill="#CBDD57" transform="translate(-10 -8)" clip-path="url(#b)"/>
      <ellipse cx="88" cy="150" rx="10" ry="22" fill="#E3EE8F" transform="rotate(12 88 150)"/>
    </g>
  </g>
</svg>
