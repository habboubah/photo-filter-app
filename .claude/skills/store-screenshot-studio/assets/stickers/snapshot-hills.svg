<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- A snapshot of hills and sun — an original drawing for the store screenshots (store-screenshot-studio).
       The paper edge is the filter below, so the art itself stays plain shapes. -->
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="2.6" result="soft"/>
      <feComponentTransfer in="soft" result="edge"><feFuncA type="linear" slope="12" intercept="-5.5"/></feComponentTransfer>
      <feFlood flood-color="#FFFDF8" result="paper"/>
      <feComposite in="paper" in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="pic"><rect x="62" y="56" width="116" height="104" rx="3"/></clipPath>
  </defs>
  <g filter="url(#cut)">
    <g transform="rotate(-8 120 120)">
      <rect x="50" y="44" width="140" height="160" rx="8" fill="#FFFFFF"/>
      <rect x="50" y="44" width="140" height="160" rx="8" fill="none" stroke="#E7E0D3" stroke-width="2"/>
      <g clip-path="url(#pic)">
        <rect x="62" y="56" width="116" height="104" fill="#DCEBF5"/>
        <circle cx="146" cy="84" r="14" fill="#F2B544"/>
        <path d="M54 160 L94 112 L118 136 L140 116 L186 160 Z" fill="#1C6B65"/>
        <path d="M54 160 L82 132 L104 150 L128 134 L186 160 Z" fill="#2E8B6E"/>
      </g>
    </g>
  </g>
</svg>
