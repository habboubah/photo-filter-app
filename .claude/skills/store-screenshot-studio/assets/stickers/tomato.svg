<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Tomato — an original drawing for the store screenshots (store-screenshot-studio).
       The paper edge is the filter below, so the art itself stays plain shapes. -->
  <defs>
    <filter id="cut" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="fat"/>
      <feGaussianBlur in="fat" stdDeviation="2.6" result="soft"/>
      <feComponentTransfer in="soft" result="edge"><feFuncA type="linear" slope="12" intercept="-5.5"/></feComponentTransfer>
      <feFlood flood-color="#FFF8F1" result="paper"/>
      <feComposite in="paper" in2="edge" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="b"><ellipse cx="120" cy="134" rx="80" ry="72"/></clipPath>
  </defs>
  <g filter="url(#cut)">
    <ellipse cx="120" cy="134" rx="80" ry="72" fill="#CF3521"/>
    <ellipse cx="112" cy="124" rx="80" ry="72" fill="#EC4F3A" clip-path="url(#b)"/>
    <ellipse cx="76" cy="108" rx="11" ry="22" fill="#FF8D7C" transform="rotate(28 76 108)"/>
    <g fill="#3E9B4F">
      <ellipse cx="120" cy="52" rx="9" ry="26" transform="rotate(0 120 72)"/>
      <ellipse cx="120" cy="52" rx="9" ry="26" transform="rotate(72 120 72)"/>
      <ellipse cx="120" cy="52" rx="9" ry="26" transform="rotate(144 120 72)"/>
      <ellipse cx="120" cy="52" rx="9" ry="26" transform="rotate(216 120 72)"/>
      <ellipse cx="120" cy="52" rx="9" ry="26" transform="rotate(288 120 72)"/>
    </g>
    <circle cx="120" cy="72" r="9" fill="#2A7A3B"/>
    <rect x="114" y="30" width="12" height="40" rx="6" fill="#2A7A3B" transform="rotate(14 120 70)"/>
  </g>
</svg>
