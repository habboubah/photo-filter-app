name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The privacy check drives the built app in Chromium.
      - run: npx playwright install --with-deps chromium
      # lint, the security check (no console.*, npm audit), tests, the build,
      # the privacy check (no request leaves the app; every URL in the bundle
      # is on the allowlist; no network code in our Swift and Kotlin), the
      # performance budgets (50,000 photos, the bundle) and the contrast audit.
      - run: npm run check

  # The iPhone's feature code (pure Swift) against the shared test pictures.
  # The runner image ships Swift; the rest of the iOS app needs a Mac.
  ios-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/PhotoFeatures

  # The Android app compiles and its feature tests pass — a debug APK, never signed or published here.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx vite build --mode native
      - run: npx cap sync android
      - run: ./gradlew testDebugUnitTest assembleDebug
        working-directory: android
