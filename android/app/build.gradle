apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version.toString()
def appVersionParts = appVersion.tokenize('.').collect { it.toInteger() }
// 1.2.7 becomes 1020700; a second upload of the same version adds ANDROID_BUILD (1–99).
def appBuild = (System.getenv('ANDROID_BUILD') ?: '0').toInteger()
def appVersionCode = appVersionParts[0] * 1000000 + appVersionParts[1] * 10000 + appVersionParts[2] * 100 + appBuild

// The upload key (never in the repository): scripts/release-android.js passes it from .env.release.
def releaseStore = System.getenv('ANDROID_KEYSTORE_PATH')

android {
    namespace = "com.habboubah.bildklar"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.habboubah.bildklar"
        // 30 (Android 11): MediaStore's trash and write requests, so a deleted photo always lands
        // in the Trash and a moved one goes only after the system asked (docs/PLAN.md).
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // One version for both stores: package.json's.
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseStore) signingConfig signingConfigs.release
            // R8 on: Play gets the mapping file (inside the AAB) for readable crash and ANR reports.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        // The feature tests read the shared pictures in ../../fixtures/features (the repository root);
        // the AI test the golden fixtures in ../../fixtures/ai and the model in ../../ai-assets.
        unitTests.all {
            it.systemProperty 'fixtures', file('../../fixtures/features').absolutePath
            it.systemProperty 'aiFixtures', file('../../fixtures/ai').absolutePath
            it.systemProperty 'aiAssets', file('../../ai-assets').absolutePath
        }
    }
    // The on-device AI's model and label vectors (docs/AI.md): one copy in the repository (ai-assets/),
    // copied into the APK's assets/ai/ at build time.
    sourceSets {
        main { assets.srcDir(layout.buildDirectory.dir('generated/ai-assets')) }
    }
}

def copyAiAssets = tasks.register('copyAiAssets', Copy) {
    from('../../ai-assets') { include 'image.onnx', 'vectors.bin', 'vectors.json', 'LICENSES.md' }
    into(layout.buildDirectory.dir('generated/ai-assets/ai'))
}
preBuild.dependsOn(copyAiAssets)

// The unit tests run ONNX Runtime on the build machine (the desktop library), not the Android one.
configurations.matching { it.name.endsWith('UnitTestRuntimeClasspath') }.configureEach {
    exclude group: 'com.microsoft.onnxruntime', module: 'onnxruntime-android'
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // EXIF from the original file: the GPS position (with ACCESS_MEDIA_LOCATION) and the time taken.
    implementation "androidx.exifinterface:exifinterface:$exifInterfaceVersion"
    implementation "androidx.heifwriter:heifwriter:$heifwriterVersion"
    // Google Play Billing: the one-time unlock. Talks to the Play Store app on the phone, not to a server of ours.
    implementation "com.android.billingclient:billing:$billingVersion"
    // Media3 Transformer: a smaller copy of a video, made on the phone (no network, no analytics).
    implementation "androidx.media3:media3-transformer:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"
    // The on-device AI (docs/AI.md): ONNX Runtime runs the shared image model on the phone's CPU. A library
    // inside the app — it sends nothing anywhere.
    implementation "com.microsoft.onnxruntime:onnxruntime-android:$onnxruntimeVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "com.microsoft.onnxruntime:onnxruntime:$onnxruntimeVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// No Google services, no Firebase, no analytics, no ML Kit: the app reports nothing to anyone.
