# The labels the shared image model scores every photo for (src/logic/ai.ts LABELS
# lists the same ids in the same order — keep both in step; `npm run check:ai`
# compares them).
#
# kind: utility = something taken to remember a piece of information, not a
#       moment (a receipt, a whiteboard, a meme someone sent). These feed the
#       "Unwichtige Fotos" card — never deleted on their own, only suggested.
#       memory = what a family keeps photos for. These feed the category row
#       and protect a photo from being suggested as "unwichtig".
#
# prompts: English, lower case (SigLIP 2 was trained on lower-cased text). A
# photo's score for a label is the best of its prompts. More prompts per label
# help; keep each one a plain description of what is in the picture.
labels:
  - id: receipt
    kind: utility
    prompts:
      - a photo of a paper receipt
      - a printed shop receipt with prices
      - a crumpled till receipt on a table
      - a restaurant bill
  - id: document
    kind: utility
    prompts:
      - a photo of a printed document
      - a photo of a letter on paper
      - a page of text photographed with a phone
      - a photo of a form or an invoice
      - a photo of an id card or a ticket
  - id: whiteboard
    kind: utility
    prompts:
      - a photo of a whiteboard with writing
      - a photo of a presentation slide on a projector screen
      - a photo of a blackboard with notes
      - handwritten notes on paper
  - id: screen
    kind: utility
    prompts:
      - a photo of a computer screen
      - a photo of a laptop screen taken with a phone
      - a photo of a tv screen
      - a photo of an error message on a monitor
  - id: chat
    kind: utility
    prompts:
      - a screenshot of a chat conversation
      - a screenshot of a messaging app
      - a screenshot of a phone app
      - a screenshot of a website
  - id: meme
    kind: utility
    prompts:
      - a meme with text
      - an internet meme with a caption
      - a funny picture with big text on it
      - a greeting card image with text
  - id: code
    kind: utility
    prompts:
      - a photo of a qr code
      - a photo of a barcode
      - a qr code on a poster
  - id: accidental
    kind: utility
    prompts:
      - an accidental photo of the floor
      - a black photo taken by accident
      - a blurry photo taken inside a pocket
      - a photo of a finger covering the lens
      - an accidental photo of the ceiling
  - id: kids
    kind: memory
    prompts:
      - a photo of a child
      - a photo of a baby
      - children playing
      - a family photo with kids
  - id: people
    kind: memory
    prompts:
      - a photo of people
      - a portrait of a person
      - a group of friends
      - a selfie
  - id: pet
    kind: memory
    prompts:
      - a photo of a dog
      - a photo of a cat
      - a pet animal
  - id: food
    kind: memory
    prompts:
      - a photo of food on a plate
      - a photo of a meal
      - a birthday cake
      - a photo of a dish in a restaurant
  - id: landscape
    kind: memory
    prompts:
      - a landscape photo
      - a photo of the beach and the sea
      - a photo of mountains
      - a photo of a city skyline
      - a sunset
