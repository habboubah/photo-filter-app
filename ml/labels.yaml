# The labels the shared image model scores every photo for (src/logic/ai.ts LABELS
# lists the same ids in the same order — keep both in step; `npm run check:ai`
# compares them).
#
# kind: utility = something taken to remember a piece of information, not a
#       moment (a receipt, a whiteboard, a meme someone sent). These feed the
#       "Unwichtige Fotos" card — never deleted on their own, only suggested.
#       sensitive = a photo of an identity document or a bank card: never
#       suggested, never shown as a category (it is kept for a reason).
#       memory = what a family keeps photos for. These feed the categories
#       and protect a photo from being suggested as "unwichtig".
#
# Since AI version 2 the labels live apart from the model: the phone stores
# each photo's compact embedding and the app scores the labels itself
# (src/logic/aiLabels.json, built by ml/labels.py). A new or changed label
# needs no new scan — only `python ml/labels.py` and LABELS_VERSION.
#
# prompts: English, lower case (SigLIP 2 was trained on lower-cased text). A
# photo's score for a label comes from the mean of its prompts. More prompts per label
# help; keep each one a plain description of what is in the picture.
# The label's vector is the mean of its prompts' vectors.
labels:
  - id: receipt
    kind: utility
    prompts:
      - a photo of a paper receipt
      - a printed shop receipt with prices
      - a crumpled till receipt on a table
      - a restaurant bill
  - id: document
    kind: utility
    prompts:
      - a photo of a printed document
      - a photo of a letter on paper
      - a page of text photographed with a phone
      - a photo of a form or an invoice
  - id: whiteboard
    kind: utility
    prompts:
      - a photo of a whiteboard with writing
      - a photo of a presentation slide on a projector screen
      - a photo of a blackboard with notes
      - handwritten notes on paper
  - id: screen
    kind: utility
    prompts:
      - a photo of a computer screen
      - a photo of a laptop screen taken with a phone
      - a photo of a tv screen
      - a photo of an error message on a monitor
  - id: chat
    kind: utility
    prompts:
      - a screenshot of a chat conversation
      - a screenshot of a messaging app
      - a screenshot of a phone app
      - a screenshot of a website
  - id: meme
    kind: utility
    prompts:
      - a meme with text
      - an internet meme with a caption
      - a funny picture with big text on it
      - a greeting card image with text
  - id: code
    kind: utility
    prompts:
      - a photo of a qr code
      - a photo of a barcode
      - a qr code on a poster
  - id: accidental
    kind: utility
    prompts:
      - an accidental photo of the floor
      - a black photo taken by accident
      - a blurry photo taken inside a pocket
      - a photo of a finger covering the lens
      - an accidental photo of the ceiling
  - id: ticket
    kind: utility
    prompts:
      - a photo of a boarding pass
      - a photo of a train ticket
      - a photo of a parking ticket
      - a photo of a concert ticket
      - a photo of an entrance ticket
  - id: product
    kind: utility
    prompts:
      - a photo of a product on a shop shelf
      - a photo of a price tag in a store
      - a photo of a product box to buy later
      - a photo of a label on a package
  - id: parking
    kind: utility
    prompts:
      - a photo of a parking garage level sign
      - a photo of a parking space number
      - a photo of a sign in a car park to remember where the car is
  - id: map
    kind: utility
    prompts:
      - a photo of a map
      - a screenshot of directions on a map
      - a photo of a timetable at a bus stop
      - a photo of an information sign with opening hours
  - id: idcard
    kind: sensitive
    prompts:
      - a photo of a passport
      - a photo of an identity card
      - a photo of a driving licence
      - a photo of a residence permit card
  - id: bankcard
    kind: sensitive
    prompts:
      - a photo of a credit card
      - a photo of a bank card
      - a photo of a debit card on a table
  - id: kids
    kind: memory
    prompts:
      - a photo of a child
      - children playing
      - a family photo with kids
      - a toddler smiling
  - id: baby
    kind: memory
    prompts:
      - a photo of a newborn baby
      - a baby sleeping
      - a baby in a crib
      - a baby being held by a parent
  - id: people
    kind: memory
    prompts:
      - a photo of people
      - a portrait of a person
      - a group of friends
      - people smiling at the camera
  - id: selfie
    kind: memory
    prompts:
