# The search vocabulary (Suche, docs/features.md): what the app can find by a
# word, without a text model on the phone. Each concept has an English prompt
# (what SigLIP 2 sees, lower case) and the words people type for it in each of
# the app's languages. ml/words.py turns it into src/search/words.json.
#
#   prompt | English words | German words | Arabic words   (words: comma-separated)
